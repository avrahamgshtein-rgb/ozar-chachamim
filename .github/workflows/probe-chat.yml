name: Probe chat (temporary)

# One-off check of the live assistant: asks the production /api/chat one question and
# keeps the answer or the error as an artifact. Remove this file once it has run.
on:
  push:
    branches: [claude/tender-keller-ugj09l]
    paths: [.github/workflows/probe-chat.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the live assistant one question
        run: |
          BASE=https://ozar-chachamim-app.vercel.app
          mkdir -p out
          echo "GET /api/chat"
          curl -sS -m 30 -o out/get.json -w '%{http_code}\n' "$BASE/api/chat" | tee out/get.status
          head -c 600 out/get.json; echo
          echo "POST /api/chat"
          curl -sS -m 90 -H 'content-type: application/json' \
            -d '{"message":"מי היה רש״י ומה הרעיון המרכזי שלו?","locale":"he"}' \
            -o out/post.json -w '%{http_code}\n' "$BASE/api/chat" | tee out/post.status
          head -c 1500 out/post.json; echo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-probe
          path: out/
          retention-days: 3

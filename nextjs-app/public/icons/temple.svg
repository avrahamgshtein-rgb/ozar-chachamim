<svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stoneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DCC8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9B89A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="marbleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0DED5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Foundation/Base -->
  <rect x="20" y="180" width="160" height="50" fill="url(#stoneGradient)" stroke="url(#goldGradient)" stroke-width="2"/>
  <line x1="20" y1="185" x2="180" y2="185" stroke="url(#goldGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="195" x2="180" y2="195" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.4"/>

  <!-- Underground chamber door -->
  <rect x="80" y="210" width="40" height="25" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" rx="2"/>
  <circle cx="115" cy="222" r="2" fill="url(#goldGradient)"/>

  <!-- Left outer wall/column -->
  <rect x="30" y="90" width="12" height="90" fill="url(#stoneGradient)" stroke="url(#goldGradient)" stroke-width="1"/>
  <polygon points="30,90 42,90 40,75 32,75" fill="url(#goldGradient)"/>

  <!-- Left support columns -->
  <rect x="48" y="75" width="8" height="105" fill="url(#marbleGradient)" stroke="url(#goldGradient)" stroke-width="1"/>
  <polygon points="48,75 56,75 54,60 50,60" fill="url(#goldGradient)"/>
  <ellipse cx="52" cy="75" rx="4" ry="2" fill="url(#goldGradient)" opacity="0.8"/>

  <rect x="62" y="75" width="8" height="105" fill="url(#marbleGradient)" stroke="url(#goldGradient)" stroke-width="1"/>
  <polygon points="62,75 70,75 68,60 64,60" fill="url(#goldGradient)"/>
  <ellipse cx="66" cy="75" rx="4" ry="2" fill="url(#goldGradient)" opacity="0.8"/>

  <!-- Central structure -->
  <rect x="70" y="50" width="60" height="130" fill="url(#stoneGradient)" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- Decorative entablature (horizontal band) -->
  <rect x="68" y="48" width="64" height="8" fill="url(#goldGradient)"/>
  <path d="M 68 48 L 132 48 L 130 40 L 70 40 Z" fill="url(#goldGradient)" opacity="0.9"/>

  <!-- Decorative pattern on entablature -->
  <circle cx="78" cy="52" r="1.5" fill="url(#stoneGradient)"/>
  <circle cx="88" cy="52" r="1.5" fill="url(#stoneGradient)"/>
  <circle cx="98" cy="52" r="1.5" fill="url(#stoneGradient)"/>
  <circle cx="108" cy="52" r="1.5" fill="url(#stoneGradient)"/>
  <circle cx="118" cy="52" r="1.5" fill="url(#stoneGradient)"/>
  <circle cx="128" cy="52" r="1.5" fill="url(#stoneGradient)"/>

  <!-- Golden spikes/crenellation on roof -->
  <polygon points="75,40 77,25 79,40" fill="url(#goldGradient)"/>
  <polygon points="85,40 87,25 89,40" fill="url(#goldGradient)"/>
  <polygon points="95,40 97,22 99,40" fill="url(#goldGradient)"/>
  <polygon points="105,40 107,22 109,40" fill="url(#goldGradient)"/>
  <polygon points="115,40 117,25 119,40" fill="url(#goldGradient)"/>
  <polygon points="125,40 127,25 129,40" fill="url(#goldGradient)"/>

  <!-- Central golden door -->
  <rect x="85" y="110" width="30" height="50" fill="url(#goldGradient)" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.9"/>
  <rect x="87" y="112" width="26" height="46" fill="url(#goldGradient)" opacity="0.7"/>

  <!-- Door frame detail -->
  <rect x="84" y="108" width="32" height="54" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Door handle -->
  <circle cx="113" cy="135" r="1.5" fill="url(#stoneGradient)"/>

  <!-- Door panels (vertical division) -->
  <line x1="100" y1="110" x2="100" y2="160" stroke="url(#stoneGradient)" stroke-width="1" opacity="0.5"/>

  <!-- Door horizontal details -->
  <line x1="85" y1="125" x2="115" y2="125" stroke="url(#stoneGradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="85" y1="140" x2="115" y2="140" stroke="url(#stoneGradient)" stroke-width="0.8" opacity="0.4"/>

  <!-- Right support columns -->
  <rect x="130" y="75" width="8" height="105" fill="url(#marbleGradient)" stroke="url(#goldGradient)" stroke-width="1"/>
  <polygon points="130,75 138,75 136,60 132,60" fill="url(#goldGradient)"/>
  <ellipse cx="134" cy="75" rx="4" ry="2" fill="url(#goldGradient)" opacity="0.8"/>

  <rect x="144" y="75" width="8" height="105" fill="url(#marbleGradient)" stroke="url(#goldGradient)" stroke-width="1"/>
  <polygon points="144,75 152,75 150,60 146,60" fill="url(#goldGradient)"/>
  <ellipse cx="148" cy="75" rx="4" ry="2" fill="url(#goldGradient)" opacity="0.8"/>

  <!-- Right outer wall/column -->
  <rect x="158" y="90" width="12" height="90" fill="url(#stoneGradient)" stroke="url(#goldGradient)" stroke-width="1"/>
  <polygon points="158,90 170,90 168,75 160,75" fill="url(#goldGradient)"/>

  <!-- Ornamental top cap -->
  <ellipse cx="100" cy="22" rx="25" ry="8" fill="url(#goldGradient)" opacity="0.8"/>
  <path d="M 75 22 Q 100 8 125 22" fill="url(#goldGradient)" opacity="0.6"/>

  <!-- Rays/light effect behind -->
  <g opacity="0.15">
    <line x1="100" y1="15" x2="100" y2="0" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <line x1="115" y1="20" x2="125" y2="8" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <line x1="85" y1="20" x2="75" y2="8" stroke="url(#goldGradient)" stroke-width="1.5"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הדמיה תלת-ממדית — הרחבת חדר הישיבות</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#dfe8ee}
  #hud{position:fixed;top:14px;right:14px;background:rgba(255,255,255,.92);padding:14px 18px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);max-width:320px}
  #hud h1{font-size:17px;margin:0 0 6px;color:#1F4E5F}
  #hud p{font-size:12.5px;margin:4px 0;color:#444}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:middle}
  #hint{position:fixed;bottom:14px;right:14px;background:rgba(255,255,255,.85);padding:8px 14px;border-radius:8px;font-size:12px;color:#555}
  #views{position:fixed;top:14px;left:14px}
  #views button{font-family:inherit;font-size:13px;margin:0 0 6px 6px;padding:7px 14px;border:1px solid #b9c6cf;border-radius:8px;background:#fff;cursor:pointer}
  #views button:hover{background:#eef4f8}
</style>
</head>
<body>
<div id="hud">
  <h1>הדמיה תלת-ממדית — התוכנית המוצעת</h1>
  <p><span class="sw" style="background:#5B9BD5"></span>חדר ישיבות מוגדל — 31.5 מ"ר, 14–16 מושבים</p>
  <p><span class="sw" style="background:#8fd0f0;border:1px solid #5B9BD5"></span>מחיצת זכוכית אקוסטית חדשה + דלת כפולה</p>
  <p><span class="sw" style="background:#E8C9A0"></span>משרד מוקטן (12 מ"ר) · חדר שינה · סלון</p>
</div>
<div id="views">
  <button onclick="setView('persp')">מבט פרספקטיבה</button>
  <button onclick="setView('top')">מבט על</button>
  <button onclick="setView('room')">בתוך חדר הישיבות</button>
</div>
<div id="hint">גרירה — סיבוב · גלגלת — זום · גרירה ימנית — הזזה</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdfe8ee);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,.55));
const sun=new THREE.DirectionalLight(0xfff4e0,.85);
sun.position.set(-8,14,-6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8e8,0x8a7f70,.35));

const W=13.2,D=10,H=2.75,CX=W/2,CZ=D/2;
const M={
  wall:new THREE.MeshStandardMaterial({color:0xf2efe8,roughness:.9}),
  wallTop:new THREE.MeshStandardMaterial({color:0x9aa3a8,roughness:.9}),
  floorMeet:new THREE.MeshStandardMaterial({color:0xcfe0ef,roughness:.85}),
  floorWood:new THREE.MeshStandardMaterial({color:0xd8c3a0,roughness:.8}),
  floorBath:new THREE.MeshStandardMaterial({color:0xdcdcd4,roughness:.7}),
  glass:new THREE.MeshStandardMaterial({color:0x8fd0f0,transparent:true,opacity:.28,roughness:.1,metalness:.1}),
  frame:new THREE.MeshStandardMaterial({color:0x2b6ea5,roughness:.5}),
  wood:new THREE.MeshStandardMaterial({color:0x8a5a33,roughness:.6}),
  woodLight:new THREE.MeshStandardMaterial({color:0xb08a5a,roughness:.6}),
  chair:new THREE.MeshStandardMaterial({color:0x3d6e9e,roughness:.7}),
  fabric:new THREE.MeshStandardMaterial({color:0xb9c4bc,roughness:.9}),
  fabric2:new THREE.MeshStandardMaterial({color:0xc9b8a8,roughness:.9}),
  white:new THREE.MeshStandardMaterial({color:0xfafafa,roughness:.5}),
  dark:new THREE.MeshStandardMaterial({color:0x333333,roughness:.4}),
  screen:new THREE.MeshStandardMaterial({color:0x111820,roughness:.3})
};

function box(mat,w,h,d,x,y,z,ry=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function cyl(mat,r,h,x,y,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function wallSeg(x1,z1,x2,z2,t=.12,h=H){
  const len=Math.hypot(x2-x1,z2-z1);
  const m=box(M.wall,len,h,t,(x1+x2)/2,h/2,(z1+z2)/2,-Math.atan2(z2-z1,x2-x1));
  box(M.wallTop,len,.04,t+.02,(x1+x2)/2,h+.02,(z1+z2)/2,-Math.atan2(z2-z1,x2-x1));
  return m;
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0xb9c9b2,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);

function floorRect(mat,x1,z1,x2,z2){
  const f=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),mat);
  f.rotation.x=-Math.PI/2;f.position.set((x1+x2)/2,.001,(z1+z2)/2);f.receiveShadow=true;scene.add(f);
}
floorRect(M.floorMeet,0,0,8.1,3.9);
floorRect(M.floorWood,8.1,0,W,3.9);
floorRect(M.floorWood,0,3.9,W,D);
floorRect(M.floorBath,0,8.2,3.4,D);

wallSeg(0,0,8.57,0,.25); wallSeg(11.07,0,W,0,.25);
wallSeg(0,D,W,D,.25);
wallSeg(0,0,0,D,.25); wallSeg(W,0,W,D,.25);
wallSeg(0,4.0,6.07,4.0,.2); wallSeg(7.0,4.0,10.0,4.0,.2); wallSeg(11.43,4.0,W,4.0,.2);
wallSeg(4.4,4.1,4.4,5.36); wallSeg(4.4,6.34,4.4,D);
wallSeg(0,8.2,2.14,8.2); wallSeg(3.13,8.2,4.4,8.2);

const gWall=box(M.glass,.06,H-.1,3.9,8.1,(H-.1)/2,1.95);
box(M.frame,.1,H,.1,8.1,H/2,.05);
box(M.frame,.1,H,.1,8.1,H/2,3.85);
box(M.frame,.1,H,.1,8.1,H/2,1.0);
box(M.frame,.1,H,.1,8.1,H/2,2.9);
box(M.frame,.12,.08,3.9,8.1,H-.06,1.95);
box(M.frame,.08,.04,1.9,8.1,2.15,1.95);

box(M.wood,4.8,.08,1.4,4.05,.74,1.95);
box(M.dark,.1,.66,.1,2.0,.33,1.5);box(M.dark,.1,.66,.1,6.1,.33,1.5);
box(M.dark,.1,.66,.1,2.0,.33,2.4);box(M.dark,.1,.66,.1,6.1,.33,2.4);
const chairAt=(x,z,ry)=>{box(M.chair,.5,.08,.5,x,.45,z,ry);box(M.chair,.5,.55,.08,x-Math.sin(ry)*.23,.72,z-Math.cos(ry)*.23,ry);cyl(M.dark,.05,.45,x,.22,z);};
for(let i=0;i<6;i++){const x=1.95+i*.85;chairAt(x,1.0,0);chairAt(x,2.9,Math.PI);}
chairAt(1.05,1.95,-Math.PI/2);chairAt(7.05,1.95,Math.PI/2);
box(M.screen,.08,1.1,1.9,.18,1.5,1.95);
box(M.fabric,.04,1.2,2.6,.03,1.75,1.95);

box(M.woodLight,.9,.74,1.5,12.65,.37,1.7);
box(M.woodLight,.9,.74,1.5,12.65,.37,3.3);
chairAt(11.9,1.7,Math.PI/2);chairAt(11.9,3.3,Math.PI/2);
cyl(M.woodLight,.45,.72,9.4,.36,2.9);
box(M.fabric2,.8,.75,.8,8.9,.4,1.1);

box(M.woodLight,1.7,.45,2.1,1.35,.22,5.4);
box(M.white,1.6,.15,1.9,1.35,.52,5.35);
box(M.wood,1.7,.9,.12,1.35,.45,4.4);
box(M.woodLight,.45,.5,.45,.35,.25,4.6);box(M.woodLight,.45,.5,.45,2.35,.25,4.6);
box(M.wood,3.6,2.3,.5,2.1,1.15,7.85);

box(M.white,1.7,.55,.8,1.0,.27,9.5);
cyl(M.white,.22,.42,3.0,.2,9.0);
box(M.white,.5,.85,.3,3.9,.42,8.5);

const sofa=(x,z,ry)=>{box(M.fabric,2.4,.45,.9,x,.28,z,ry);box(M.fabric,2.4,.55,.25,x-Math.sin(ry)*.38,.63,z-Math.cos(ry)*.38,ry);};
sofa(7.05,6.2,Math.PI/2);sofa(11.15,6.2,-Math.PI/2);
box(M.wood,.95,.4,.95,9.1,.2,6.3);
cyl(M.woodLight,.4,.36,10.2,.18,6.3);
box(M.fabric2,.8,.7,.8,7.9,.38,8.9,-.15);box(M.fabric2,.8,.7,.8,10.1,.38,8.9,.15);
cyl(M.wood,.2,.45,9.0,.22,9.0);
box(M.wood,.35,1.1,2.1,12.85,.55,6.4);
box(M.wood,.5,1.4,2.6,5.75,.7,6.8);

const target=new THREE.Vector3(CX,.6,CZ);
let theta=-2.35,phi=.98,dist=16.5;
function updateCam(){
  camera.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);
}
function setView(v){
  if(v==='top'){theta=-Math.PI/2;phi=.06;dist=15;target.set(CX,.6,CZ);}
  else if(v==='room'){theta=-.35;phi=1.35;dist=5.2;target.set(4.05,1.0,1.95);}
  else{theta=-2.35;phi=.98;dist=16.5;target.set(CX,.6,CZ);}
  updateCam();
}
window.setView=setView;
updateCam();

let drag=false,pan=false,px=0,py=0;
const el=renderer.domElement;
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('mousedown',e=>{drag=e.button===0;pan=e.button===2;px=e.clientX;py=e.clientY;});
addEventListener('mouseup',()=>{drag=pan=false;});
addEventListener('mousemove',e=>{
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(drag){theta+=dx*.006;phi=Math.min(1.52,Math.max(.05,phi-dy*.005));updateCam();}
  if(pan){
    const right=new THREE.Vector3().subVectors(camera.position,target).cross(camera.up).normalize();
    target.addScaledVector(right,dx*.01);
    const fwd=new THREE.Vector3().subVectors(target,camera.position);fwd.y=0;fwd.normalize();
    target.addScaledVector(fwd,dy*.012);
    updateCam();
  }
});
el.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(35,Math.max(3,dist*(1+Math.sign(e.deltaY)*.09)));updateCam();},{passive:false});
let tPX=0,tPY=0,pinch=0;
el.addEventListener('touchstart',e=>{if(e.touches.length===1){tPX=e.touches[0].clientX;tPY=e.touches[0].clientY;}else if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}});
el.addEventListener('touchmove',e=>{e.preventDefault();
  if(e.touches.length===1){const dx=e.touches[0].clientX-tPX,dy=e.touches[0].clientY-tPY;tPX=e.touches[0].clientX;tPY=e.touches[0].clientY;theta+=dx*.006;phi=Math.min(1.52,Math.max(.05,phi-dy*.005));updateCam();}
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);dist=Math.min(35,Math.max(3,dist*pinch/d));pinch=d;updateCam();}
},{passive:false});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);})();
</script>
</body>
</html>

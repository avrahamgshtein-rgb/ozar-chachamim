name: Probe YouTube (temporary)

# One-off: tries other yt-dlp player clients to read the spoken language of a few playlist videos,
# so the pairs of videos per sage can be split into English and Russian. Remove after it has run.
on:
  push:
    branches: [claude/tender-keller-ugj09l]
    paths: [.github/workflows/probe-youtube.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Try several clients on one pair
        run: |
          pip install -q yt-dlp
          for client in android_vr tv_embedded web_embedded mweb ios; do
            echo "== client $client"
            yt-dlp -J --skip-download --no-warnings --extractor-args "youtube:player_client=$client" "https://www.youtube.com/watch?v=V_IWxYu1f9Y" > one.json 2> err.txt || { echo "FAILED"; head -c 200 err.txt; echo; continue; }
            python3 - <<'PY'
          import json
          d = json.load(open('one.json'))
          ac = sorted(d.get('automatic_captions', {}).keys())
          print('title:', d.get('title'))
          print('language:', d.get('language'), '| auto -orig:', [k for k in ac if k.endswith('-orig')], '| auto count:', len(ac))
          PY
          done
          echo "== timedtext list"
          curl -s -m 20 "https://www.youtube.com/api/timedtext?v=V_IWxYu1f9Y&type=list" | head -c 400; echo
          echo "== watch page"
          curl -s -m 20 -A "Mozilla/5.0" "https://www.youtube.com/watch?v=V_IWxYu1f9Y" | grep -o '"defaultAudioLanguage":"[^"]*"\|"languageCode":"[^"]*"\|"captionTracks":\[{[^]]\{0,300\}' | head -5

name: Probe YouTube (temporary)

# One-off: prints the current contents of the sages playlist from a GitHub runner (the sandbox
# cannot reach YouTube's playlist pages) so data/youtube-playlist.tsv can be refreshed. Remove after it has run.
on:
  push:
    branches: [claude/tender-keller-ugj09l]
    paths: [.github/workflows/probe-youtube.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The playlist
        run: |
          pip install -q yt-dlp
          yt-dlp --flat-playlist --no-warnings \
            --print "ROW|%(playlist_index)s|%(id)s|%(duration)s|%(title)s" \
            "https://www.youtube.com/playlist?list=PLZTqkkizXfX-8NLT5G77GBhgMylisckyf" | tee playlist.txt
          echo "ROWS: $(grep -c '^ROW|' playlist.txt)"

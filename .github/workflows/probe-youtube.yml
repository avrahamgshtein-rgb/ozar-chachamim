name: Probe YouTube (temporary)

# One-off: loads a few playlist videos in a real browser and reads their caption tracks, to learn
# the spoken language (YouTube's automatic captions are made in the detected language). Remove after
# it has run.
on:
  push:
    branches: [claude/tender-keller-ugj09l]
    paths: [.github/workflows/probe-youtube.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Caption tracks of a sample, read in a browser
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          cat > probe.py <<'PY'
          import json, sys
          from playwright.sync_api import sync_playwright
          sample = [(13,'V_IWxYu1f9Y'),(14,'q5x9P6uZGpE'),(59,'HN4xheHyH7s'),(60,'PQJAHFKdwJg'),(93,'qWkGCUgsagA'),(94,'zNRv16vRMqM'),(125,'2O9fB4pFm5E'),(126,'TuIOTBpjNZE'),(657,'BJb0xFe53U8'),(658,'uqI_wh57lO8'),(1,'llK6TjhR-ok'),(2,'3tqZnY6xxJ4')]
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(locale='en-US', user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36')
              ctx.add_cookies([{'name':'CONSENT','value':'YES+1','domain':'.youtube.com','path':'/'},{'name':'SOCS','value':'CAI','domain':'.youtube.com','path':'/'}])
              for row, vid in sample:
                  page = ctx.new_page()
                  try:
                      page.goto('https://www.youtube.com/watch?v=' + vid, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(2500)
                      info = page.evaluate("""() => {
                        const r = window.ytInitialPlayerResponse || {};
                        const t = (((r.captions||{}).playerCaptionsTracklistRenderer||{}).captionTracks||[]).map(x => (x.languageCode||'') + ':' + (x.kind||'manual'));
                        return {status: (r.playabilityStatus||{}).status, reason: ((r.playabilityStatus||{}).reason||'').slice(0,80), tracks: t, title: ((r.videoDetails||{}).title||'').slice(0,60), lang: document.documentElement.lang}
                      }""")
                      print('row', row, vid, json.dumps(info, ensure_ascii=False))
                  except Exception as e:
                      print('row', row, vid, 'ERR', str(e)[:120])
                  page.close()
              b.close()
          PY
          python3 probe.py
